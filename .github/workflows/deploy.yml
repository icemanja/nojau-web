# Publica la web en GitHub Pages.
# Se ejecuta al subir cambios, cada día a las 06:15 (hora UTC) para traer los
# últimos artículos del blog, y a mano desde la pestaña Actions.
name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # historial completo para fechar el sitemap

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/

      - name: Traer los últimos artículos del blog
        run: python3 tools/update_blog.py _site

      - name: Actualizar fechas del sitemap
        run: python3 tools/update_sitemap.py _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
